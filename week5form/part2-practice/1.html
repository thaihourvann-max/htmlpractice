<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h2>Create Account</h2>
    <form>
<div>
  <label>First name *</label>
  <input type="text" placeholder="enter your first name">
</div>

<div>
  <label>Last name</label>
  <input type="text" placeholder="enter your last name">
</div>

<div class="full">
  <label>Email *</label>
  <input type="email" placeholder="enter your email">
</div>
<div>
    <label>Password*</label>
    <input type="password" placeholder="enter your password">
</div>
<div>
    <label>Cofirm Password*</label>
    <input type="password" placeholder="enter your password again">
</div>
<div>
  <label>Gender:</label>
  <label><input type="radio" name="gender"> Male</label>
  <label><input type="radio" name="gender"> Female</label>
</div>

<div>
  <label>Hobbies:</label>
  <label><input type="checkbox"> Music</label>
  <label><input type="checkbox"> Sports</label>
  <label><input type="checkbox"> Travel</label>
  <label><input type="checkbox"> Movies</label>
</div>

<div>
  <label>Source of Income</label>
  <select>
    <option>Employed</option>
    <option>Student</option>
    <option>Business</option>
  </select>
</div>

<div>
  <label>Income</label>
  <input type="range" min="0" max="100" value="20">
  <span class="badge">20K</span>
</div>

<div>
  <label>Upload Profile Picture</label>
  <input type="file">
</div>

<div>
  <label>Age</label>
  <input type="number" value="18">
</div>

<div class="full">
  <label>Bio</label>
  <textarea rows="5"></textarea>
</div>

<button class="full">Create</button>

</div>

    </form>
  </div>
</body>
</html>
