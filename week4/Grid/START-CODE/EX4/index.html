<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <div class="sidebar">
      <h2>Linglee</h2>
      <a href="#dashboard" class="active">Dashboard</a>
      <a href="#classes">Classes</a>
      <a href="#chat">Chat</a>
      <a href="#settings">Settings</a>
    </div>
    <div class="main">
      <div class="welcome">
        <h1>Welcome back Anna!</h1>
        <p>You learned 80% of your goal this week. Keep it up!</p>
      </div>

      <div class="row">
        <div class="box">
          <h3>Latest results</h3>

          <p>Technology - 25%</p>
          <div class="bar">
            <div class="fill fill-25"></div>
          </div>

          <p>Ecology - 44%</p>
          <div class="bar">
            <div class="fill fill-44"></div>
          </div>

          <p>Job market - 76%</p>
          <div class="bar">
            <div class="fill fill-76"></div>
          </div>
        </div>

        <div class="box">
          <h3>Your courses</h3>
          <div class="course course-1">Grammar</div>
          <div class="course course-2">Phrasal verbs</div>
          <div class="course course-3">Vocabulary</div>
        </div>

      </div>
    </div>

  </div>

</body>
</html>
